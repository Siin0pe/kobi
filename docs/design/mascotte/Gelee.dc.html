<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gelée, verre dépoli lumineux</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E8EBF2}
a{color:#4338CA}a:hover{color:#312E81}
@keyframes a1{0%,100%{transform:translate(-30px,-20px) scale(1)}50%{transform:translate(40px,30px) scale(1.25)}}
@keyframes a2{0%,100%{transform:translate(40px,30px) scale(1.1)}50%{transform:translate(-30px,-40px) scale(.85)}}
@keyframes a3{0%,100%{transform:translate(0,50px) scale(.9)}50%{transform:translate(10px,-30px) scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jelly{0%,100%{transform:scale(1,1)}30%{transform:scale(1.08,.92)}50%{transform:scale(.95,1.06)}70%{transform:scale(1.03,.97)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.1,.88)}45%{transform:translateY(-26px) scale(.94,1.06)}70%{transform:translateY(0) scale(1.06,.94)}}
@keyframes halo{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.18);opacity:.9}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes fill{0%{width:0}80%,100%{width:100%}}
@keyframes popin{0%{transform:translate(-50%,10px) scale(.3);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.wrap{position:relative;width:300px;height:320px;display:flex;align-items:center;justify-content:center}
.mover{animation:float 4s ease-in-out infinite}
.m-answer .mover{animation:jelly .7s ease-in-out infinite}
.m-suggest .mover{animation:jump 1.1s ease-in-out infinite}
.halo{position:absolute;width:230px;height:230px;border-radius:70px;filter:blur(30px);opacity:0}
.m-listen .halo{opacity:.7;animation:halo 1.2s ease-in-out infinite}
.squircle{position:relative;width:200px;height:200px;border-radius:68px;overflow:hidden;background:rgba(255,255,255,.3)}
.lights{position:absolute;inset:0;filter:blur(26px)}
.m-think .lights{animation:spin 1.6s linear infinite}
.m-idle .lights{opacity:.45;filter:blur(30px) saturate(.4)}
.b{position:absolute;width:120px;height:120px;border-radius:50%;left:40px;top:40px}
.b1{animation:a1 6s ease-in-out infinite}
.b2{animation:a2 7s ease-in-out infinite}
.b3{animation:a3 5s ease-in-out infinite}
.m-listen .b,.m-answer .b{animation-duration:1.8s}
.m-write .b3{animation-duration:2s}
.glass{position:absolute;inset:0;border-radius:68px;background:linear-gradient(160deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.28) 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8),inset 0 -14px 30px rgba(80,90,140,.18),inset 0 10px 24px rgba(255,255,255,.7)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:34px;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.m-think .face{transform:translate(14px,-16px)}
.m-write .face{transform:translate(-8px,14px)}
.eye{width:22px;height:40px;border-radius:14px;background:#FFFFFF;box-shadow:0 4px 12px rgba(40,40,90,.35);transition:height .3s,border-radius .3s;animation:blink 4.2s infinite}
.m-idle .eye{height:7px;animation:none}
.m-listen .eye{height:48px;width:26px}
.m-answer .eye{height:14px;border-radius:14px 14px 4px 4px;animation:none}
.m-suggest .eye{height:46px}
.bars{position:absolute;left:40px;right:40px;bottom:30px;display:none;flex-direction:column;gap:6px}
.m-write .bars{display:flex}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.85);animation:fill 1.8s ease-out infinite}
.bar.k2{animation-delay:.3s;max-width:70%}
.plus{position:absolute;top:-4px;left:50%;width:50px;height:50px;border-radius:18px;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 10px 24px rgba(60,180,80,.35);color:#166534;font:800 28px 'Geist',sans-serif;animation:popin .5s cubic-bezier(.3,1.5,.5,1) both}
.m-suggest .plus{display:flex}
.floor{width:150px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,70,120,.25),transparent)}
.chip:hover{border-color:#8B93A7}
</style>
</helmet>
<div style="width: 600px; height: 680px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #E8EBF2; color: #1A1C24; font-family: 'Geist', system-ui, sans-serif;">
  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <h2 style="margin: 0; font-weight: 800; font-size: 32px; letter-spacing: -.03em;">Gelée</h2>
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #6A7083;">03 / verre</span>
  </div>
  <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4B5163;">Un bonbon de verre dépoli, avec des lumières qui nagent dedans. La couleur des lumières dit ce qu'il fait.</p>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div class="{{ cls }}">
      <div class="wrap">
        <div class="halo" style="background: {{ c1 }};"></div>
        <div class="mover">
          <div class="squircle">
            <div class="lights">
              <div class="b b1" style="background: {{ c1 }};"></div>
              <div class="b b2" style="background: {{ c2 }};"></div>
              <div class="b b3" style="background: {{ c3 }};"></div>
            </div>
            <div class="glass"></div>
            <div class="face"><div class="eye"></div><div class="eye"></div></div>
            <div class="bars"><div class="bar"></div><div class="bar k2"></div></div>
          </div>
        </div>
        <div class="plus">+</div>
      </div>
    </div>
    <div class="floor"></div>
    <div style="margin-top: 14px; font-family: 'Geist Mono', monospace; font-size: 13px; color: #3A3F4F;">{{ status }}</div>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px;">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
      <button type="button" class="chip" onClick="{{ c.pick }}" style="min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; font: 600 13px 'Geist', sans-serif; cursor: pointer;">{{ c.label }}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":680}}'>
var ORDER = ['idle', 'listen', 'think', 'write', 'answer', 'suggest'];
var LABEL = { idle: 'Veille', listen: 'Écoute', think: 'Réfléchit', write: 'Note', answer: 'Répond', suggest: 'Propose' };
var STATUS = { idle: 'en veille', listen: 'écoute…', think: 'réfléchit…', write: 'prend des notes', answer: 'répond', suggest: 'a une idée' };
var COL = {
  idle:    ['#A5B4CF', '#C7CCE0', '#B8C2D8'],
  listen:  ['#3B82F6', '#22D3EE', '#818CF8'],
  think:   ['#A855F7', '#EC4899', '#6366F1'],
  write:   ['#F59E0B', '#FB7185', '#FCD34D'],
  answer:  ['#10B981', '#38BDF8', '#34D399'],
  suggest: ['#84CC16', '#22C55E', '#FACC15']
};
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'idle', auto: true }; }
  componentDidMount() {
    var self = this;
    this.iv = setInterval(function () {
      if (!self.state.auto) return;
      self.setState({ mode: ORDER[(ORDER.indexOf(self.state.mode) + 1) % ORDER.length] });
    }, 3200);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    var self = this, st = this.state, c = COL[st.mode];
    return {
      cls: 'm-' + st.mode, status: STATUS[st.mode], c1: c[0], c2: c[1], c3: c[2],
      chips: ORDER.map(function (k) {
        var on = k === st.mode;
        return { label: LABEL[k], bg: on ? '#1A1C24' : 'rgba(255,255,255,.6)', fg: on ? '#FFFFFF' : '#1A1C24', border: on ? '#1A1C24' : '#C9CEDB',
          pick: function () { self.setState({ mode: k, auto: false }); } };
      })
    };
  }
}
</script>
</body>
</html>
