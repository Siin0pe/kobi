<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Matrice, visage en LED</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F2EF}
a{color:#C2410C}a:hover{color:#9A3412}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px) rotate(-2deg)}55%{transform:translateY(0) rotate(1deg)}70%{transform:translateY(-5px)}}
@keyframes lean{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dev{animation:hover 4s ease-in-out infinite}
.m-suggest .dev{animation:bounce 1s ease-in-out infinite}
.m-think .dev{animation:lean 1.4s ease-in-out infinite}
.dot{transition:background .06s linear}
.chip:hover{border-color:#111}
</style>
</helmet>
<div style="width: 600px; height: 680px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #F2F2EF; color: #111111; font-family: 'Space Mono', monospace;">
  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <h2 style="margin: 0; font-family: 'Doto', monospace; font-weight: 900; font-size: 40px; letter-spacing: .02em;">MATRICE</h2>
    <span style="font-size: 12px; color: #6B6B66;">02 / led</span>
  </div>
  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4A4A46;">Un petit écran à points, façon objet hardware. Chaque expression est dessinée pixel par pixel, en orange sur noir.</p>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
    <div class="{{ cls }}">
      <div class="dev" style="padding: 34px 38px; border-radius: 64px; background: #0E0E0E; border: 1px solid #2A2A2A; box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 30px 50px rgba(0,0,0,.25);">
        <div style="display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 6px; width: 294px;">
          <sc-for list="{{ dots }}" as="d" hint-placeholder-count="135">
            <span class="dot" style="display: block; width: 14px; height: 14px; border-radius: 50%; background: {{ d.bg }}; box-shadow: {{ d.glow }};"></span>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #FF4D1F;"></span>
      <span>{{ status }}</span>
    </div>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px;">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
      <button type="button" class="chip" onClick="{{ c.pick }}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }}; font: 700 12px 'Space Mono', monospace; cursor: pointer;">{{ c.label }}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":680}}'>
var ORDER = ['idle', 'listen', 'think', 'write', 'answer', 'suggest'];
var LABEL = { idle: 'Veille', listen: 'Écoute', think: 'Réfléchit', write: 'Note', answer: 'Répond', suggest: 'Propose' };
var STATUS = { idle: 'en veille', listen: 'écoute', think: 'réfléchit', write: 'prend des notes', answer: 'répond', suggest: 'a une idée' };
var W = 15, H = 9;
var PERIM = (function () {
  var p = [], c, r;
  for (c = 0; c < W; c++) p.push([0, c]);
  for (r = 1; r < H; r++) p.push([r, W - 1]);
  for (c = W - 2; c >= 0; c--) p.push([H - 1, c]);
  for (r = H - 2; r > 0; r--) p.push([r, 0]);
  return p;
})();
function rect(on, r0, r1, c0, c1) { for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) on[r * W + c] = 1; }
function frame(mode, t) {
  var on = {}, i, c, h, r;
  if (mode === 'idle') {
    rect(on, 5, 5, 3, 5); rect(on, 5, 5, 9, 11);
  } else if (mode === 'listen') {
    rect(on, 2, 5, 3, 5); rect(on, 2, 5, 9, 11);
    [0, 1, 13, 14].forEach(function (col, k) {
      h = Math.round(1 + 2.6 * Math.abs(Math.sin(t * 0.55 + k * 1.7)));
      for (r = 4 - h; r <= 4 + h; r++) if (r >= 0 && r < H) on[r * W + col] = 1;
    });
  } else if (mode === 'think') {
    rect(on, 2, 3, 5, 6); rect(on, 2, 3, 10, 11);
    var L = PERIM.length, head = t % L;
    for (i = 0; i < 4; i++) { var p = PERIM[(head - i + L) % L]; on[p[0] * W + p[1]] = 1; }
  } else if (mode === 'write') {
    rect(on, 3, 4, 3, 4); rect(on, 3, 4, 9, 10);
    var n = t % 18;
    for (c = 1; c <= Math.min(13, n); c++) if (c !== 4 && c !== 9) on[7 * W + c] = 1;
    if (t % 4 < 2) on[7 * W + Math.min(13, n + 1)] = 1;
  } else if (mode === 'answer') {
    [[3, 3], [2, 4], [3, 5], [3, 9], [2, 10], [3, 11]].forEach(function (p) { on[p[0] * W + p[1]] = 1; });
    for (c = 5; c <= 9; c++) {
      h = Math.floor(1.9 * Math.abs(Math.sin(t * 0.9 + c * 1.3)));
      for (r = 6 - h; r <= 6 + h; r++) on[r * W + c] = 1;
    }
  } else {
    rect(on, 2, 5, 2, 4); rect(on, 2, 5, 8, 10);
    if (t % 6 < 4) { rect(on, 1, 5, 13, 13); on[7 * W + 13] = 1; }
  }
  return on;
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'idle', auto: true, t: 0, since: 0 }; }
  componentDidMount() {
    var self = this;
    this.iv = setInterval(function () {
      var st = self.state, t = st.t + 1, next = { t: t };
      if (st.auto && t - st.since > 32) { next.mode = ORDER[(ORDER.indexOf(st.mode) + 1) % ORDER.length]; next.since = t; }
      self.setState(next);
    }, 100);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    var self = this, st = this.state, on = frame(st.mode, st.t), dots = [], i;
    var dim = st.mode === 'idle' ? (0.45 + 0.35 * Math.abs(Math.sin(st.t * 0.12))) : 1;
    var lit = 'rgba(255,77,31,' + dim.toFixed(2) + ')';
    for (i = 0; i < W * H; i++) {
      dots.push(on[i] ? { bg: lit, glow: '0 0 10px rgba(255,77,31,' + (0.7 * dim).toFixed(2) + ')' } : { bg: '#1D1D1D', glow: 'none' });
    }
    return {
      cls: 'm-' + st.mode,
      status: STATUS[st.mode],
      dots: dots,
      chips: ORDER.map(function (k) {
        var sel = k === st.mode;
        return { label: LABEL[k], bg: sel ? '#111111' : 'transparent', fg: sel ? '#F2F2EF' : '#111111', border: sel ? '#111111' : '#BDBDB7',
          pick: function () { self.setState({ mode: k, auto: false, since: self.state.t }); } };
      })
    };
  }
}
</script>
</body>
</html>
