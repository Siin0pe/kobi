# Moteurs de transcription basés sur ggml (whisper.cpp, transcribe.cpp) :
# instructions AVX/AVX2/FMA/F16C/BMI2 imposées. Sous MSVC, GGML_NATIVE ne
# détecte pas le processeur et ggml retombe en code scalaire, ce qui fausse
# les mesures CPU. Ces variables ne servent qu'aux builds de ggml ; une valeur
# déjà présente dans l'environnement est conservée. Sur ARM, ggml ignore les
# options x86.
#
# Processeur sans AVX2 (Intel avant Haswell, comme l'i5-3470 du homelab) :
#   export GGML_AVX2=OFF GGML_FMA=OFF GGML_BMI2=OFF
#   cargo clean -p whisper-rs-sys -p transcribe-cpp-sys
# BMI2 aussi : ggml l'active sinon par défaut et plante (« Illegal
# instruction »). Le cargo clean est nécessaire, les scripts de build ne se
# relancent pas quand ces variables changent. kobi-stt refuse de charger un
# whisper.cpp compilé avec des instructions absentes du processeur.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"

# Sous Linux x86_64, le C++ compilé par les crates (whisper.cpp, transcribe.cpp)
# l'est dans l'ancienne ABI de libstdc++, comme l'onnxruntime statique de
# sherpa-onnx (manylinux, GCC 11, _GLIBCXX_USE_CXX11_ABI=0). Sinon, avec
# whisper et nemotron dans le même binaire, des instances de std::regex au
# même nom mais de tailles différentes (std::__detail::_Scanner<char>, qui
# contient une std::string) se mélangent à l'édition de liens et la création
# du moteur Nemotron plante (« free(): invalid pointer », KOB-127). Ces
# bibliothèques ne parlent à Rust que par leur API C : l'ABI C++ ne déborde
# pas. Après un changement : cargo clean -p whisper-rs-sys -p transcribe-cpp-sys.
CXXFLAGS_x86_64_unknown_linux_gnu = "-D_GLIBCXX_USE_CXX11_ABI=0"
