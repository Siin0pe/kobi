[package]
name = "kobi-ctl"
description = "Interface de contrôle de Kobi : commandes, point d'accès local, CLI et serveur MCP (KOB-161)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kobi-ctl"
path = "src/bin/kobi-ctl.rs"

[dependencies]
getrandom = "0.3"
kobi-i18n = { path = "../kobi-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
