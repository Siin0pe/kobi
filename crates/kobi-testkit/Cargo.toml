[package]
name = "kobi-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Doublures de test du cerveau : faux `claude` et faux serveur MCP."

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt"] }
# Client HTTP du serveur de permission (boucle locale, sans TLS).
ureq = { version = "2", default-features = false }

[dev-dependencies]
kobi-brain = { path = "../kobi-brain" }
kobi-perms = { path = "../kobi-perms" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"
test = false

[[bin]]
name = "fake-mcp"
path = "src/bin/fake-mcp.rs"
test = false
