[package]
name = "kobi-app"
description = "Coque Tauri 2 de Kobi : fenêtre transparente de la mascotte."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kobi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kobi-audio = { path = "../kobi-audio" }
kobi-brain = { path = "../kobi-brain" }
kobi-ctl = { path = "../kobi-ctl" }
kobi-perms = { path = "../kobi-perms" }
kobi-session = { path = "../kobi-session" }
kobi-stt = { path = "../kobi-stt", features = ["nemotron"] }
kobi-tts = { path = "../kobi-tts", features = ["piper", "lecture"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
bzip2 = "0.5"
tar = "0.4"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tracing = "0.1"
# Serveurs MCP connectés (KOB-155) : test des serveurs et autorisation OAuth,
# secrets dans le gestionnaire d'identifiants du système.
async-trait = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3.5", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
# Test d'intégration de la carte de validation avec le serveur de permission (KOB-62).
kobi-perms = { path = "../kobi-perms" }
rmcp = { version = "3.5", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"

[features]
# Embarque l'interface construite (`ui/dist`) au lieu du serveur de développement.
custom-protocol = ["tauri/custom-protocol"]
