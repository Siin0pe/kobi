[package]
name = "kobi-app"
description = "Coque Tauri 2 de Kobi : fenêtre transparente de la mascotte."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kobi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["macos-private-api"] }

[features]
# Embarque l'interface construite (`ui/dist`) au lieu du serveur de développement.
custom-protocol = ["tauri/custom-protocol"]
