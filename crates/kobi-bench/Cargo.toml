[package]
name = "kobi-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Moteurs optionnels (bibliothèques natives téléchargées au build).
# Kyutai STT 1B en_fr (candle, Rust pur).
kyutai = ["kobi-stt/kyutai"]
nemotron = ["kobi-stt/nemotron"]
nemotron-shared = ["kobi-stt/nemotron-shared"]
# Voxtral Realtime via transcribe.cpp ; TRANSCRIBE_DIR évite de recompiler le C++.
voxtral = ["kobi-stt/voxtral"]
voxtral-cuda = ["kobi-stt/voxtral-cuda"]
whisper = ["kobi-stt/whisper"]
whisper-cuda = ["whisper", "kobi-stt/whisper-cuda"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
hound = "3.5.1"
kobi-audio = { version = "0.1.0", path = "../kobi-audio" }
kobi-brain = { version = "0.1.0", path = "../kobi-brain" }
kobi-stt = { version = "0.1.0", path = "../kobi-stt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
