[package]
name = "kobi-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Moteurs optionnels (bibliothèques natives téléchargées au build).
nemotron = ["kobi-stt/nemotron"]
nemotron-shared = ["kobi-stt/nemotron-shared"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
hound = "3.5.1"
kobi-audio = { version = "0.1.0", path = "../kobi-audio" }
kobi-stt = { version = "0.1.0", path = "../kobi-stt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
