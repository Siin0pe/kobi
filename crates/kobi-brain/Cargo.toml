[package]
name = "kobi-brain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kobi-perms = { path = "../kobi-perms" }
# Backend clé API (KOB-101) : mêmes réglages que rmcp dans kobi-app.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["net"] }
# Journaux capturés : ni clé ni contenu de conversation (KOB-322).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[[bin]]
name = "claude-essai"
path = "src/bin/claude-essai.rs"

