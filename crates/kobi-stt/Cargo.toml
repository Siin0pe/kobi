[package]
name = "kobi-stt"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Adaptateur Kyutai STT 1B en_fr via la crate moshi (candle), CPU, sans
# bibliothèque native.
kyutai = ["dep:moshi", "dep:candle", "dep:candle-nn", "dep:candle-transformers", "dep:kobi-audio", "dep:serde_json"]
# Adaptateur Nemotron 3.5 ASR Streaming via sherpa-onnx. `nemotron` : CPU,
# bibliothèques statiques téléchargées au build. `nemotron-shared` :
# bibliothèques partagées, par exemple la version CUDA désignée par
# SHERPA_ONNX_LIB_DIR. Les deux sont exclusives.
nemotron = ["dep:sherpa-onnx", "sherpa-onnx/static"]
nemotron-shared = ["dep:sherpa-onnx", "sherpa-onnx/shared"]
# Adaptateur Voxtral Mini 4B Realtime via transcribe.cpp. Compile le C++ (CMake),
# sauf si TRANSCRIBE_DIR désigne une installation déjà construite.
# `voxtral-cuda` : backend CUDA (nvcc requis).
voxtral = ["dep:transcribe-cpp"]
voxtral-cuda = ["voxtral", "transcribe-cpp/cuda"]
# Adaptateur Whisper (whisper.cpp) ; demande cmake et libclang.
whisper = ["dep:whisper-rs"]
# Whisper sur GPU NVIDIA ; demande le toolkit CUDA (nvcc).
whisper-cuda = ["whisper", "whisper-rs/cuda"]

[dependencies]
candle = { package = "candle-core", version = "0.9.1", optional = true }
candle-nn = { version = "0.9.1", optional = true }
candle-transformers = { version = "0.9.1", optional = true }
hound = "3.5"
kobi-audio = { version = "0.1.0", path = "../kobi-audio", optional = true }
moshi = { version = "=0.6.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sherpa-onnx = { version = "=1.13.8", optional = true, default-features = false }
thiserror = "2"
transcribe-cpp = { version = "0.4.0", default-features = false, optional = true }
whisper-rs = { version = "0.16", optional = true }
