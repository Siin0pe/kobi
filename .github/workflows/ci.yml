name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Moteurs optionnels : bibliothèques natives téléchargées au build, sans
      # modèle (les tests qui en demandent un sont ignorés).
      - name: Moteur Nemotron (sherpa-onnx)
        run: |
          cargo clippy -p kobi-stt -p kobi-bench --features kobi-stt/nemotron,kobi-bench/nemotron --all-targets -- -D warnings
          cargo test -p kobi-stt -p kobi-bench --features kobi-stt/nemotron,kobi-bench/nemotron
