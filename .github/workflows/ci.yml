name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Target plus petit (KOB-397) : les étapes à moteur (Nemotron, Kyutai)
  # relient de gros binaires de test après celles du workspace ; avec les
  # infos de débogage complètes, le disque du runner ubuntu se remplissait
  # et ld mourait (Bus error). Les numéros de ligne restent dans les traces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Place sur le disque du runner ubuntu (KOB-397) : les SDK qu'aucune
      # étape n'utilise (.NET, Android, GHC, CodeQL) font plus de 20 Go.
      - name: Place disque (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Dépendances système Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --no-fail-fast (KOB-412) : tous les binaires de test tournent, même
      # après un rouge ; le job reste rouge, mais un run montre tous les
      # échecs de l'OS, pas seulement le premier.
      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # Moteurs optionnels : bibliothèques natives téléchargées au build, sans
      # modèle (les tests qui en demandent un sont ignorés). Ils tournent même
      # si l'étape Tests est rouge (`!cancelled()`, le job reste rouge) : un
      # run montre tous les échecs (KOB-412).
      - name: Moteur Nemotron (sherpa-onnx)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p kobi-stt -p kobi-bench --features kobi-stt/nemotron,kobi-bench/nemotron --all-targets -- -D warnings
          cargo test --no-fail-fast -p kobi-stt -p kobi-bench --features kobi-stt/nemotron,kobi-bench/nemotron

      # Mot-clé avec ONNX Runtime lié statiquement (binaires précompilés
      # d'ort ; le défaut, ort-dynamic, est couvert par le workspace).
      - name: Mot-clé, ONNX Runtime statique
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p kobi-wake --no-default-features --features ort-static --all-targets -- -D warnings
          cargo test --no-fail-fast -p kobi-wake --no-default-features --features ort-static

      - name: Place disque avant Kyutai (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: df -h /

      # Kyutai STT : candle, Rust pur, rien de natif à télécharger.
      - name: Moteur Kyutai (moshi, candle)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p kobi-stt -p kobi-bench --features kobi-stt/kyutai,kobi-bench/kyutai --all-targets -- -D warnings
          cargo test --no-fail-fast -p kobi-stt -p kobi-bench --features kobi-stt/kyutai,kobi-bench/kyutai

      - name: Place disque à la fin (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: df -h /

  # L'interface sous Linux et sous Windows (KOB-376) : le nom du job ubuntu
  # ne change pas, le train et les règles de la branche s'y fient.
  ui:
    name: interface (chromium${{ matrix.os == 'windows-latest' && ', windows' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Navigateur
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test

      - name: Captures de chaque état de Kobi
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ffmpeg
          node scripts/captures.mjs --out captures/kobi --seconds 2.5

      - name: Publier les captures
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: captures-kobi
          path: ui/captures
          retention-days: 30

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14
