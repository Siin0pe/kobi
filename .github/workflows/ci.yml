name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # Moteurs optionnels : bibliothèques natives téléchargées au build, sans
      # modèle (les tests qui en demandent un sont ignorés).
      - name: Moteur Nemotron (sherpa-onnx)
        run: |
          cargo clippy -p kobi-stt -p kobi-bench --features kobi-stt/nemotron,kobi-bench/nemotron --all-targets -- -D warnings
          cargo test -p kobi-stt -p kobi-bench --features kobi-stt/nemotron,kobi-bench/nemotron

      # Mot-clé avec ONNX Runtime lié statiquement (binaires précompilés
      # d'ort ; le défaut, ort-dynamic, est couvert par le workspace).
      - name: Mot-clé, ONNX Runtime statique
        run: |
          cargo clippy -p kobi-wake --no-default-features --features ort-static --all-targets -- -D warnings
          cargo test -p kobi-wake --no-default-features --features ort-static

      # Kyutai STT : candle, Rust pur, rien de natif à télécharger.
      - name: Moteur Kyutai (moshi, candle)
        run: |
          cargo clippy -p kobi-stt -p kobi-bench --features kobi-stt/kyutai,kobi-bench/kyutai --all-targets -- -D warnings
          cargo test -p kobi-stt -p kobi-bench --features kobi-stt/kyutai,kobi-bench/kyutai

  ui:
    name: interface (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Navigateur
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test

      - name: Captures de chaque état de chaque skin
        run: |
          sudo apt-get install -y ffmpeg
          for skin in kobi gribouille mercure matrice gelee essaim; do
            node scripts/captures.mjs --skin "$skin" --out "captures/$skin" --seconds 2.5
          done

      - name: Publier les captures
        uses: actions/upload-artifact@v4
        with:
          name: captures-skins
          path: ui/captures
          retention-days: 30

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14
